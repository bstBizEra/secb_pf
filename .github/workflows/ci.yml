# SecB CI — the executable control gates.
#
# CONTROL_GATES.md defines ten gates as prose. This workflow makes three
# of them mechanically fail-able:
#
#   test-gate      (gate 5, Test)      — FIT-101..120 + repo tests must pass
#   authority-gate (gate 1, Authority) — every PR must cite a SECB-WP-* ID
#   budget-gate    (AGENTS.md §6/§7)   — every PR must declare a diff budget
#                                        and stay inside it
#
# CI is a signal, not a hard gate: nothing here blocks a push to main by
# itself. A red run is the evidence a reviewer or human merge decision
# must read before acting.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-gate:
    name: "Gate 5 — Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # -p no:cacheprovider + PYTHONDONTWRITEBYTECODE keep pytest from
      # writing cache artifacts into the sandbox-evidence directory, which
      # must stay checksum-stable (EVIDENCE_RECORD.md).
      - name: Run FIT-101..120 (skill-router sandbox) and repo tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >
          python -m pytest -p no:cacheprovider -q
          "docs/06-agent-orchestration/skill-router/SECB-WP-ENGLOOP-MVP-001 — Sandbox Evidence/test_router.py"
          tests/

  authority-gate:
    name: "Gate 1 — Authority (No Ticket, No Work)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PR title/body are attacker-controlled text; they enter through the
      # environment, never through shell interpolation.
      - name: Require a SECB-WP-* work-package reference
        env:
          WP_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: python scripts/check_work_package_ref.py

  budget-gate:
    name: "Budget circuit breaker (AGENTS.md §6/§7)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history so both the PR base and head are present for the
      # three-dot diff (merge-base to head = the PR's own changes).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce the declared diff budget
        env:
          BUDGET_TEXT: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          git diff --numstat "$BASE_SHA...$HEAD_SHA"
          | python scripts/check_budget.py

  merge-autonomy:
    name: "Merge autonomy verdict (advisory)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory by design: this job reports whether the standing R1
    # authorization covers the PR. It must never block — a HUMAN_REQUIRED
    # verdict is the normal answer for governance and enforcement changes,
    # not a failure.
    #
    # `continue-on-error` alone is not enough: it keeps the *workflow run*
    # green but still reports the job's own check as `failure`, which reads
    # as a broken build on the PR. So the step captures the classifier's
    # exit code, records the verdict in the job summary, and exits 0. The
    # verdict lives in the summary and the log; the check stays green.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify R1 merge eligibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --numstat "$BASE_SHA...$HEAD_SHA" > /tmp/pr.numstat
          set +e
          verdict=$(python scripts/check_merge_autonomy.py < /tmp/pr.numstat 2>&1)
          code=$?
          set -e
          echo "$verdict"
          {
            echo "### Merge autonomy verdict"
            echo ""
            echo '```'
            echo "$verdict"
            echo '```'
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "Standing R1 authorization covers this PR (see \`docs/00-governance/STANDING_MERGE_AUTHORIZATION.md\`). All gates must still be green."
            else
              echo "**Human merge required.** This is a normal verdict for governance, enforcement, oversized, or unclassified changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
