# SecB CI — the executable control gates.
#
# CONTROL_GATES.md defines ten gates as prose. This workflow makes three
# of them mechanically fail-able, and reports a fourth signal.
#
# Checks are named for WHAT THEY DO, not by number (SECB-WP-FWK-068).
# Two different steps were both called "Gate 6", and the CI numbering was a
# second, unregistered use of gate numbering — the registered GATE ladder is
# GATE-001..GATE-010, bound to two-plane verdict rules. A duplicate number is
# the same defect as a duplicate work-package ID: the label stops identifying
# one thing.
#
#   Functional name                                  Historical alias
#   ----------------------------------------------   ---------------------
#   Test — repository and FIT suite                  "Gate 5 — Test"
#   Safety — prohibited-call scan (NFR-18)           "Gate 6 - prohibited-call scan"
#   Security — committed-secret scan (NFR-17)        "Gate 6 - committed-secret scan"
#   Authority — work-package binding                 "Gate 1 — Authority (No Ticket, No Work)"
#   Budget — declared ceiling                        "Budget circuit breaker (AGENTS.md §6/§7)"
#   Governance — authority-delta verdict (advisory)  "Governance verdict (advisory)"
#
# The aliases are for audit readback only — historical check-runs keep the
# names they were created with, and a query joining on name across time needs
# both. A missing number does not mean a missing control, and renaming a check
# does not implement a new gate.
#
# "Governance" is retained deliberately in the verdict check's name: the K-09
# ledger counts observations with `check_runs[].name | grep -qi governance`
# (docs/13-evidence/K09_LEDGER.md). A rename dropping that token would silently
# count zero observations forever while the ledger kept appending rows.
#
# CI is a signal, not a hard gate: nothing here blocks a push to main by
# itself. A red run is the evidence a reviewer or human merge decision
# must read before acting.

name: ci

on:
  push:
    branches: [main]
  # `edited` and `ready_for_review` are listed explicitly because the default
  # for `pull_request:` is [opened, synchronize, reopened] — under which a title
  # or body edit fires nothing at all, leaving a green check bound to metadata
  # that no longer exists (SECB-WP-FWK-068). A workflow re-run cannot substitute:
  # it replays the ORIGINAL event payload, so it would re-evaluate the old title.
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  test-gate:
    name: "Test — repository and FIT suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # -p no:cacheprovider + PYTHONDONTWRITEBYTECODE keep pytest from
      # writing cache artifacts into the sandbox-evidence directory, which
      # must stay checksum-stable (EVIDENCE_RECORD.md).
      - name: Run FIT-101..120 (skill-router sandbox) and repo tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >
          python -m pytest -p no:cacheprovider -q
          "docs/06-agent-orchestration/skill-router/SECB-WP-ENGLOOP-MVP-001 — Sandbox Evidence/test_router.py"
          tests/

      # NFR-18: the sandbox router performs no external effect. Verified twice by
      # hand -- at certification and at independent review -- and never since.
      # SECB-WP-FWK-048 makes it a gate. ast-based, so a mention in a docstring is
      # not a finding and a set.remove() is not a filesystem write, which the
      # first version of the scanner got wrong (DEF-ENGLOOP-MVP-001).
      - name: "Safety — prohibited-call scan (NFR-18)"
        run: |
          python scripts/check_prohibited_calls.py \
            "docs/06-agent-orchestration/skill-router/SECB-WP-ENGLOOP-MVP-001 — Sandbox Evidence" \
            src

      # NFR-17: no credential or secret is committed. Verified by "repository
      # scan" -- by hand, the third such NFR after NFR-04 and NFR-18.
      # SECB-WP-FWK-049 makes it a gate. Two rules: known credential shapes
      # anywhere, and secret-named assignments with a real-looking value.
      # Requiring both name AND value is what keeps it usable -- six SHA-256
      # digests live in the tracked tree and every one is an evidence anchor.
      - name: "Security — committed-secret scan (NFR-17)"
        run: |
          python scripts/check_committed_secrets.py \
            AGENTS.md README.md docs config scripts src tests .github

  authority-gate:
    name: "Authority — work-package binding"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PR title/body are attacker-controlled text; they enter through the
      # environment, never through shell interpolation.
      - name: Require a work-package reference (prefix from the envelope)
        env:
          WP_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: python scripts/check_work_package_ref.py

      # What this check evaluated, so a later reader can prove it. A result bound
      # only to head_sha cannot distinguish "still current" from "the title changed
      # underneath it" — see scripts/emit_pr_input_binding.py.
      - name: Record the metadata this check evaluated
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/emit_pr_input_binding.py

  badf-registry-gate:
    name: "BADF — registry and admission posture"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail-closed. The validator refuses on a weakened registry posture, an
      # unpinned upstream commit, an undeclared capability class, or a lifecycle
      # state that outruns its own evidence. It is wired here rather than left
      # runnable-on-request because a control nothing invokes is a declaration:
      # this repository has recorded that failure eight times (see #249).
      - name: Registry and admission posture
        run: python3 scripts/check_badf_registry.py all

  budget-gate:
    name: "Budget — declared ceiling"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history so both the PR base and head are present for the
      # three-dot diff (merge-base to head = the PR's own changes).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce the declared diff budget
        env:
          BUDGET_TEXT: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          git diff --numstat "$BASE_SHA...$HEAD_SHA"
          | python scripts/check_budget.py

      # What this check evaluated, so a later reader can prove it. A result bound
      # only to head_sha cannot distinguish "still current" from "the title changed
      # underneath it" — see scripts/emit_pr_input_binding.py.
      - name: Record the metadata this check evaluated
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/emit_pr_input_binding.py

  governance-verdict:
    name: "Governance — authority-delta verdict (advisory)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory: this job reports the authority-delta class of the PR and
    # whether the ratified delegation envelope covers it. It must never block
    # — CONSTITUTIONAL_REQUIRED is the expected verdict for a large share of
    # pull requests, and a job that presents an expected verdict as a broken
    # build trains people to ignore it. The step therefore captures the exit
    # code, records the verdict in the job summary, and exits 0.
    #
    # NOTE ON TRUST: this verifier runs inside the repository it judges, so a
    # PR could in principle edit it. That is precisely why any change under
    # .github/ classifies as G4 (CONSTITUTIONAL_REQUIRED) — the only
    # compensating control available without an organization-level ruleset.
    # See docs/14-plans/GOVERNANCE_DEFERRED_CAPABILITIES.md.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify authority delta, and evaluate under both policies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --numstat "$BASE_SHA...$HEAD_SHA" > /tmp/pr.numstat
          git diff "$BASE_SHA...$HEAD_SHA" > /tmp/pr.diff
          set +e
          # The diff goes by PATH, not by environment variable. Linux caps one
          # env string at MAX_ARG_STRLEN = 131072 bytes, and a 160-line diff of
          # long-line JSON exceeds it -- when it did, this step failed with
          # E2BIG, the classifier never ran, the G5 prohibited-action scan never
          # executed, and the summary below reported it as a routine
          # escalation. SECB-WP-FWK-043.
          # The cap applies to the change FAMILY, not to one diff: splitting a
          # change across concurrent pull requests evaded it (FWK-046). The
          # classifier is kept off the network by NFR-12, so CI computes the
          # aggregate here -- the other open PRs by this actor against this base
          # -- and passes it. Sequential splitting is NOT caught; see the
          # script's docstring.
          family=0
          for n in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                       --base "${{ github.event.pull_request.base.ref }}" \
                       --author "${{ github.event.pull_request.user.login }}" \
                       --json number --jq '.[].number'); do
            [ "$n" = "${{ github.event.pull_request.number }}" ] && continue
            lines=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n/files" --paginate \
                      --jq '[.[] | .additions + .deletions] | add // 0')
            family=$(( family + lines ))
          done
          echo "concurrent change family excluding this PR: $family lines"

          # Was this verdict computed against the tree that will actually
          # merge? Under squash merge the head goes onto whatever the base is at
          # merge time, so a base that has moved means the verdict describes a
          # different tree. Reports rather than blocks -- see the script for the
          # measurement behind that. FWK-047, scenario BACP-05.
          current_base=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/${{ github.event.pull_request.base.ref }}" \
            --jq .object.sha 2>/dev/null || echo "")
          base_out=$(python scripts/check_base_currency.py \
            "$BASE_SHA" "${current_base:-unknown}" \
            "${{ github.event.pull_request.base.ref }}" 2>&1)
          base_code=$?

          single=$(DIFF_PATH=/tmp/pr.diff FAMILY_LINES="$family" \
            python scripts/classify_authority_delta.py < /tmp/pr.numstat 2>&1)
          single_code=$?
          dual=$(BASE_REF="$BASE_SHA" \
            python scripts/check_dual_policy.py < /tmp/pr.numstat 2>&1)
          dual_code=$?
          set -e
          echo "$single"
          echo "$dual"
          {
            echo "### Governance verdict"
            echo ""
            echo '```'
            echo "$single"
            echo '```'
            echo ""
            echo "### Base currency"
            echo ""
            echo '```'
            echo "$base_out"
            echo '```'
            echo ""
            if [ "$base_code" -eq 1 ]; then
              echo "The base moved after this verdict was computed. Not a"
              echo "blocking condition -- with a queue of open pull requests"
              echo "every merge staleifies the rest -- but re-run before merging"
              echo "if the classification could plausibly differ."
            elif [ "$base_code" -eq 2 ]; then
              echo "**Base currency could not be determined.** Treat the verdict"
              echo "as unbound to a base."
            fi
            echo ""
            echo "### Dual-policy evaluation"
            echo ""
            echo '```'
            echo "$dual"
            echo '```'
            echo ""
            # 0 / 2 / 3 are the classifier's own verdicts. Anything else means
            # it did not run -- a crash, a shell failure, a missing
            # interpreter. That is INVALID GATE OUTPUT and must not be read as
            # a verdict, least of all as the routine one: before FWK-043 an
            # E2BIG failure landed in the else-branch and a prohibited change
            # would have been announced as "normal".
            if ! echo "$single_code $dual_code" | grep -Eq '^[023] [023]$'; then
              echo "**INVALID GATE OUTPUT.** A gate did not run"
              echo "(classifier exit \`$single_code\`, dual-policy exit \`$dual_code\`);"
              echo "no verdict was produced, so none may be inferred. Treat as"
              echo "unevaluated and fail closed: do not merge on this summary."
            elif [ "$single_code" -eq 0 ] && [ "$dual_code" -eq 0 ]; then
              echo "The ratified delegation envelope covers this change; all gates must still be green."
            elif [ "$single_code" -eq 3 ] || [ "$dual_code" -eq 3 ]; then
              echo "**REJECTED** — prohibited under \`docs/00-governance/L0_ROOT_CONSTITUTION.md\`. Withdraw the change."
            else
              echo "**Escalation required.** Normal for governance, constitutional, oversized, or judgement-altering changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
